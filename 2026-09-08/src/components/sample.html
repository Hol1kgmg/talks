<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>tmuxの構造(セッション/ウィンドウ/ペイン)</title>
<style>
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #f5f5f2;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 680px;
  }
  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    font-size: 13px;
    color: #5f5e5a;
  }
  .legend .dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: -1px;
  }
  .session {
    border: 1px solid #b4b2a9;
    border-radius: 12px;
    padding: 12px;
    background: #ffffff;
  }
  .session-label {
    font-size: 12px;
    color: #5f5e5a;
    margin-bottom: 8px;
  }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .tab {
    padding: 8px 16px;
    border-radius: 8px 8px 0 0;
    font-size: 13px;
  }
  .tab.active {
    background: #CECBF6;
    color: #26215C;
    font-weight: 600;
  }
  .tab.inactive {
    background: #EEEDFE;
    color: #534AB7;
  }
  .window-body {
    border: 1.5px solid #7F77DD;
    border-radius: 8px;
    padding: 8px;
    background: #F7F7FC;
  }
  .window-body-label {
    font-size: 11px;
    color: #3C3489;
    margin-bottom: 8px;
  }
  .panes {
    display: flex;
    gap: 6px;
    height: 200px;
  }
  .pane-a {
    flex: 1.3;
    background: #9FE1CB;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #04342C;
    font-size: 14px;
    font-weight: 600;
  }
  .pane-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .pane-b, .pane-c {
    flex: 1;
    background: #E1F5EE;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #085041;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="legend">
    <span><span class="dot" style="background:#d3d1c7;border:1px solid #b4b2a9;"></span>セッション</span>
    <span><span class="dot" style="background:#CECBF6;"></span>ウィンドウ(タブ)</span>
    <span><span class="dot" style="background:#9FE1CB;"></span>ペイン(分割)</span>
  </div>

  <div class="session">
    <div class="session-label">セッション = 作業全体の入れ物</div>

    <div class="tabs">
      <div class="tab active">ウィンドウ1</div>
      <div class="tab inactive">ウィンドウ2</div>
      <div class="tab inactive">ウィンドウ3</div>
    </div>

    <div class="window-body">
      <div class="window-body-label">選択中のウィンドウの中身(さらに分割される)</div>
      <div class="panes">
        <div class="pane-a">ペインA</div>
        <div class="pane-col">
          <div class="pane-b">ペインB</div>
          <div class="pane-c">ペインC</div>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
