pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,mjs,cjs,vue,json,yaml,yml,toml,md}'
      exclude: 'pnpm-lock.yaml|dist-stale/**'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    image-format:
      glob: '*.{png,jpg,jpeg,gif}'
      exclude: 'dist-stale/**'
      run: >
        echo "PNG/JPEG/GIF画像が検出されました。'mise run image <path>' でwebpに変換してから追加してください:" &&
        echo {staged_files} && exit 1
    pdf-export:
      glob: '*/src/**'
      exclude: 'dist-stale/**'
      run: pnpm exec tsx scripts/export-changed.ts {staged_files}
