[tools]
node = "22"
pnpm = "11.13.0"
ffmpeg = "latest"
lefthook = "latest"

[tasks.setup]
description = "Install dependencies and git hooks"
run = [
  "pnpm install",
  "lefthook install"
]

[tasks.dev]
description = "Start the slide picker in dev mode"
run = "pnpm run dev"

[tasks.build]
description = "Build all slides and generate Cloudflare Pages redirects"
run = "pnpm run build"

[tasks.typecheck]
description = "Type-check the project"
run = "pnpm run typecheck"

[tasks.lint]
description = "Lint the project"
run = "pnpm run lint"

[tasks.update]
description = "Regenerate dist/_redirects for Cloudflare Pages"
run = "pnpm run update"

[tasks.image]
description = "Convert an image to .webp and store it in a slide's src/public/images/"
run = "pnpm run image"

[tasks.freeze]
description = "Freeze a finished talk's build output into dist-stale/ so future builds skip rebuilding it"
run = "pnpm run freeze"
